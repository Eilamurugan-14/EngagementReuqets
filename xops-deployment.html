<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f6f9">
  <title>xOps | Version Update in Progress</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", "Segoe UI Variable", Arial, sans-serif;
      color: #242424;
      background: #f3f6f9;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 280px;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      display: grid;
      grid-template-rows: 1fr auto;
      justify-items: center;
      background: #f3f6f9;
    }

    main {
      width: 100%;
      display: grid;
      place-items: center;
      padding: 32px 20px;
    }

    .card {
      width: min(100%, 440px);
      padding: 48px 40px 44px;
      text-align: center;
      background: #fff;
      border: 1px solid #e6eaf0;
      border-radius: 12px;
      box-shadow: 0 8px 28px rgb(26 54 93 / 7%);
    }

    .brand {
      margin: 0 0 32px;
      color: #007DA3;
      font-size: 30px;
      font-weight: 650;
      letter-spacing: -1.2px;
    }

    .update-icon {
      display: grid;
      width: 64px;
      height: 64px;
      place-items: center;
      margin: 0 auto 24px;
      border-radius: 16px;
      background: #e6f4f9;
      color: #007DA3;
    }

    .update-icon svg {
      display: block;
      width: 32px;
      height: 32px;
    }

    h1 {
      margin: 0 0 14px;
      color: #242424;
      font-size: 23px;
      font-weight: 600;
      line-height: 1.3;
    }

    .message {
      margin: 0;
      color: #5b616a;
      font-size: 15px;
      line-height: 1.65;
    }

    footer {
      padding: 18px 20px 24px;
      color: #737982;
      font-size: 13px;
      text-align: center;
    }

    @media (max-width: 480px) {
      .card {
        padding: 40px 24px 36px;
      }

      .brand {
        margin-bottom: 28px;
      }

      h1 {
        font-size: 21px;
      }
    }

  </style>
</head>
<body>
  <main>
    <section class="card" aria-labelledby="status-heading">
      <p class="brand">xOps</p>
      <div class="update-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M20 17H4V5h8V3H4c-1.11 0-2 .89-2 2v12c0 1.1.89 2 2 2h4v2h8v-2h4c1.1 0 2-.9 2-2v-3h-2z" fill="currentColor"/>
          <path d="m17 14 5-5-1.41-1.41L18 10.17V3h-2v7.17l-2.59-2.58L12 9z" fill="currentColor"/>
        </svg>
      </div>
      <h1 id="status-heading">Version Update in Progress</h1>
      <p class="message">
        We’re updating xOps to the latest version. Please check back in a few minutes.
      </p>
    </section>
  </main>
  <footer>xOps</footer>
</body>
</html>
